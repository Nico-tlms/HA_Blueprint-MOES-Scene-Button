blueprint:
  name: Zigbee2MQTT - Tuya TS0044 - 4 boutons (MQTT device trigger)
  description: Automatisation pour télécommande TS0044 via Zigbee2MQTT (intégration MQTT).
  domain: automation
  source_url: https://gist.github.com/rdeangel/0362181f03cbce58b883eeaf2baa0863

  input:
    mode:
      name: Mode d'automatisation
      default: parallel
      selector:
        select:
          mode: dropdown
          options:
            - single
            - restart
            - queued
            - parallel

    zigbee_device:
      name: TS0044 (device Zigbee2MQTT)
      selector:
        device:
          integration: mqtt

    button_1_single:
      name: Bouton 1 - Simple
      default: []
      selector: { action: {} }
    button_1_double:
      name: Bouton 1 - Double
      default: []
      selector: { action: {} }
    button_1_hold:
      name: Bouton 1 - Long
      default: []
      selector: { action: {} }

    button_2_single:
      name: Bouton 2 - Simple
      default: []
      selector: { action: {} }
    button_2_double:
      name: Bouton 2 - Double
      default: []
      selector: { action: {} }
    button_2_hold:
      name: Bouton 2 - Long
      default: []
      selector: { action: {} }

    button_3_single:
      name: Bouton 3 - Simple
      default: []
      selector: { action: {} }
    button_3_double:
      name: Bouton 3 - Double
      default: []
      selector: { action: {} }
    button_3_hold:
      name: Bouton 3 - Long
      default: []
      selector: { action: {} }

    button_4_single:
      name: Bouton 4 - Simple
      default: []
      selector: { action: {} }
    button_4_double:
      name: Bouton 4 - Double
      default: []
      selector: { action: {} }
    button_4_hold:
      name: Bouton 4 - Long
      default: []
      selector: { action: {} }

mode: !input mode
max_exceeded: silent

trigger:
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 1_single
    id: b1_single
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 1_double
    id: b1_double
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 1_hold
    id: b1_hold

  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 2_single
    id: b2_single
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 2_double
    id: b2_double
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 2_hold
    id: b2_hold

  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 3_single
    id: b3_single
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 3_double
    id: b3_double
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 3_hold
    id: b3_hold

  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 4_single
    id: b4_single
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 4_double
    id: b4_double
  - platform: device
    device_id: !input zigbee_device
    domain: mqtt
    type: action
    subtype: 4_hold
    id: b4_hold

action:
  - choose:
      - conditions: [{ condition: trigger, id: b1_single }]
        sequence: !input button_1_single
      - conditions: [{ condition: trigger, id: b1_double }]
        sequence: !input button_1_double
      - conditions: [{ condition: trigger, id: b1_hold }]
        sequence: !input button_1_hold

      - conditions: [{ condition: trigger, id: b2_single }]
        sequence: !input button_2_single
      - conditions: [{ condition: trigger, id: b2_double }]
        sequence: !input button_2_double
      - conditions: [{ condition: trigger, id: b2_hold }]
        sequence: !input button_2_hold

      - conditions: [{ condition: trigger, id: b3_single }]
        sequence: !input button_3_single
      - conditions: [{ condition: trigger, id: b3_double }]
        sequence: !input button_3_double
      - conditions: [{ condition: trigger, id: b3_hold }]
        sequence: !input button_3_hold

      - conditions: [{ condition: trigger, id: b4_single }]
        sequence: !input button_4_single
      - conditions: [{ condition: trigger, id: b4_double }]
        sequence: !input button_4_double
      - conditions: [{ condition: trigger, id: b4_hold }]
        sequence: !input button_4_hold
